<div class="container">
  <!-- FORM MODE -->
  <div class="form-container col-md-12 col-lg-6 mx-auto" ng-hide="usersVm.viewMode">

    <h1 class="my-4 text-center">Add User</h1>

    <form ng-submit="usersVm.addUser()">
      <input type="text" class="form-control mb-3" ng-model="usersVm.user.name" placeholder="Name">
      <input type="text" class="form-control mb-3" ng-model="usersVm.user.surname" placeholder="Surname">
      <div class="mb-3">
        <select id="roleSelect" class="form-select" ng-model="usersVm.user.role"
          ng-options="role for role in usersVm.roles" required>
          <option value="" disabled>Please select a role</option>
        </select>
      </div>
      <input type="email" class="form-control mb-3" ng-model="usersVm.user.email" placeholder="Email">
      <input type="password" class="form-control mb-3" ng-model="usersVm.user.password" placeholder="Password">

      <div class="d-flex gap-3">
        <button type="submit" class="btn btn-primary w-50">Add</button>
        <button type="reset" class="btn btn-primary w-50" ng-click="usersVm.cancelForm()">Cancel</button>
      </div>
    </form>

  </div>


  <!-- VIEW MODE -->
  <div ng-show="usersVm.viewMode">

    <h1 class="mt-4">User List</h1>

    <div class="d-flex justify-content-end">
      <button type="button" class="btn btn-primary mb-3" ng-click="usersVm.showForm()">
        <i class="bi bi-plus-lg"></i>
      </button>
    </div>

    <table class="table table-custom">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr ng-repeat="user in usersVm.users">
          <td>{{ user.name }} {{ user.surname }}</td>
          <td>{{ user.email }}</td>
          <td>
            <span>
              {{ user.role }}
            </span>
          </td>
          <td>
            <button type="button" class="btn btn-link p-0 border-0">
              <i class="bi bi-pencil-square fs-5 text-secondary"></i>
            </button>
            <button type="button" class="btn btn-link p-0 border-0" ng-click="usersVm.deleteUser(user.id)">
              <i class="bi bi-trash fs-5 text-danger"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
