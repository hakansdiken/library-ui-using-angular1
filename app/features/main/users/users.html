<div class="container">
  <h1 class="my-4 text-center" style="color: rgb(129, 154, 145);">User List</h1>

  <div class="container">
    <table class="table table-hover">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr ng-repeat="user in usersVm.users">
          <td>{{ user.name }} {{ user.surname }}</td>
          <td>{{ user.email }}</td>
          <td>
            <span>
              {{ user.role }}
            </span>
          </td>
          <td>
            <button type="button" class="btn btn-link p-0 border-0">
              <i class="bi bi-pencil-square fs-5 text-secondary"></i>
            </button>
            <button type="button" class="btn btn-link p-0 border-0">
              <i class="bi bi-trash fs-5 text-danger"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
