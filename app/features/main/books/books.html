<div class="container">
    <h1 class="my-4 text-center" style="color: rgb(129, 154, 145);">Book List</h1>

    <div class="container">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Publisher</th>
                    <th>Publication Year</th>
                    <th>State</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="book in booksVm.books">
                    <td>{{ book.title }}</td>
                    <td>{{ book.author }}</td>
                    <td>{{ book.publisher }}</td>
                    <td>{{ book.publicationYear }}</td>
                    <td>{{ book.isBorrowed ? 'Borrowed' : 'Available' }}</td>
                    <td>
                        <button type="button" class="btn btn-link p-0 border-0">
                            <i class="bi bi-pencil-square fs-5 text-secondary"></i>
                        </button>
                        <button type="button" class="btn btn-link p-0 border-0">
                            <i class="bi bi-trash fs-5 text-danger"></i>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
